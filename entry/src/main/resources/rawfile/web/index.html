<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>图文匣 PDF 工具 - 技术验证</title>
  <link rel="stylesheet" href="css/viewer.css">
</head>
<body>
  <!-- 验证结果显示区域 -->
  <div id="verify-panel">
    <div id="status-bar">
      <span id="bridge-status">等待桥接...</span>
      <span id="lib-status">库未加载</span>
    </div>

    <!-- PDF 渲染 Canvas -->
    <div id="render-area">
      <canvas id="pdf-canvas"></canvas>
      <canvas id="overlay-canvas"></canvas>
      <div id="text-layer"></div>
    </div>

    <!-- 验证结果输出 -->
    <div id="output-area">
      <div id="output-content">等待验证...</div>
    </div>

    <!-- Canvas 手写测试区 -->
    <div id="canvas-test-area">
      <canvas id="signature-canvas"></canvas>
      <p>在此区域手写测试笔迹</p>
    </div>
  </div>

  <!-- 第三方库（必须先于业务脚本加载） -->
  <!-- pdf.js v3.11.174 (V1.0 验证用) -->
  <script src="lib/pdf.min.js"></script>
  <script>
    // 配置 pdf.js worker 路径
    if (typeof pdfjsLib !== 'undefined') {
      pdfjsLib.GlobalWorkerOptions.workerSrc = 'lib/pdf.worker.min.js';
    }
  </script>

  <!-- @maxwbh/pdf-lib v1.18.1 (V1.1 验证用) -->
  <script src="lib/pdf-lib.min.js"></script>

  <!-- tesseract.js v7.0.0 (V1.2 验证用) -->
  <script src="lib/tesseract.min.js"></script>

  <!-- JS 桥接适配层 -->
  <script src="js/bridge.js"></script>

  <!-- M0 验证脚本（内联到 index.html，彻底规避 WebView 对 verify.js 的缓存问题） -->
  <script>
/**
 * verify.js — M0 技术验证引擎（内联版）
 *
 * 20 项关键技术验证，每项测试结果通过 bridge.reportVerifyResult() 回传 ArkTS。
 * 验证项按依赖顺序分组：pdf.js → pdf-lib → tesseract.js → 桥接通信 → 系统能力
 */

var verifyEngine = null;

// 全局工具：稳健提取错误文本（兼容鸿蒙 WebView 的 Error 对象）
function extractError(err) {
  if (!err) return '';
  if (typeof err === 'string') return err;
  var parts = [];
  if (err.message) parts.push(String(err.message));
  if (err.name && err.name !== 'Error') parts.push(String(err.name));
  if (err.stack) parts.push(String(err.stack));
  if (parts.length === 0) {
    try { parts.push(JSON.stringify(err)); } catch (e) {}
  }
  if (parts.length === 0) parts.push(String(err));
  return parts.join(' | ');
}

// 全局工具：判断是否为加密相关错误
function isEncryptError(errText) {
  var t = (errText || '').toLowerCase();
  return t.indexOf('encrypt') >= 0 || t.indexOf('password') >= 0 || t.indexOf('decrypt') >= 0;
}

class VerifyEngine {
  constructor() {
    this.outputEl = document.getElementById('output-content');
    this.pdfCanvas = document.getElementById('pdf-canvas');
    this.signatureCanvas = document.getElementById('signature-canvas');
    this.testFilePath = '';  // 测试 PDF 文件路径，由 ArkTS 设置
    this.currentPdfDoc = null;
    this.log('VerifyEngine initialized, ready for testing.');
    this.log('Libraries detected: ' + this.detectLibs());
  }

  // ============ 工具方法 ============

  log(msg, type) {
    var time = new Date().toLocaleTimeString();
    var line = '[' + time + '] ' + msg;
    console.log(msg);
    if (this.outputEl) {
      this.outputEl.textContent = line + '\n' + this.outputEl.textContent;
      if (type === 'error') {
        this.outputEl.className = 'error';
      } else if (type === 'warning') {
        this.outputEl.className = 'warning';
      }
    }
  }

  report(id, status, message) {
    this.log('Verify #' + id + ': ' + status.toUpperCase() + ' - ' + message);
    if (window.nativeBridge) {
      window.nativeBridge.onVerifyResult(id, status, message);
    }
  }

  detectLibs() {
    var libs = [];
    if (typeof pdfjsLib !== 'undefined') libs.push('pdf.js');
    if (typeof PDFLib !== 'undefined') libs.push('pdf-lib');
    if (typeof Tesseract !== 'undefined') libs.push('tesseract.js');
    return libs.length > 0 ? libs.join(', ') : 'none';
  }

  // 等待条件满足
  waitFor(condition, timeout) {
    return new Promise(function(resolve, reject) {
      var start = Date.now();
      var timer = setInterval(function() {
        if (condition()) {
          clearInterval(timer);
          resolve();
        } else if (Date.now() - start > (timeout || 5000)) {
          clearInterval(timer);
          reject(new Error('Timeout waiting for condition'));
        }
      }, 100);
    });
  }

  // 设置测试文件路径
  setTestFilePath(path) {
    this.testFilePath = path;
    // 双保险：同时保存到全局变量，防止实例状态丢失
    window.__testFilePath = path;
    this.log('Test file set: ' + path);
  }

  // 获取当前有效的测试文件路径（参数优先，其次是实例状态，最后是全局变量）
  resolveTestFilePath(overridePath) {
    var path = overridePath || this.testFilePath || window.__testFilePath || '';
    return path;
  }

  // ============ 执行单个验证 ============
  async runTest(id, filePath) {
    this.log('--- Running verify #' + id + ' ---');
    var path = this.resolveTestFilePath(filePath);

    switch (id) {
      // ===== pdf.js 验证 =====
      case 1: await this.testPdfJsLoad(path); break;
      case 2: await this.testPdfJsWorker(); break;
      case 3: await this.testPdfJsPerformance(path); break;
      case 4: await this.testPdfJsGesture(); break;
      case 5: await this.testPdfJsTextExtract(path); break;

      // ===== @maxwbh/pdf-lib 验证 =====
      case 6: await this.testPdfLibLoad(); break;
      case 7: await this.testPdfLibMerge(path); break;
      case 8: await this.testPdfLibEncrypt(path); break;
      case 9: await this.testPdfLibDecrypt(path); break;

      // ===== tesseract.js 验证 =====
      case 10: await this.testTesseractLoad(); break;
      case 11: await this.testTesseractWorker(); break;
      case 12: await this.testTesseractChinese(path); break;

      // ===== 桥接通信验证 =====
      case 13: await this.testMessagePort(); break;
      case 14: await this.testRegisterProxy(); break;
      case 15: await this.testRunJavaScript(); break;

      // ===== 系统能力验证 =====
      case 16: await this.testSandboxFile(); break;
      case 17: await this.testChineseFont(); break;
      case 18: await this.testCanvasSignature(); break;
      case 19: await this.testMemoryMonitor(path); break;
      case 20: await this.testColdStart(); break;

      default:
        this.report(id, 'failed', 'Unknown test: ' + id);
    }
  }

  // ============ 执行全部验证 ============
  async runAllTests(filePath) {
    var path = this.resolveTestFilePath(filePath);
    this.log('========== Starting ALL verifications, file=' + path + ' ==========');
    for (var i = 1; i <= 20; i++) {
      try {
        await this.runTest(i, path);
        // 每项之间间隔 500ms
        await new Promise(function(r) { setTimeout(r, 500); });
      } catch (e) {
        this.report(i, 'failed', e.message || String(e));
      }
    }
    this.log('========== All verifications complete ==========');
  }

  // ========================================
  //  验证项 1-5: pdf.js 验证
  // ========================================

  // #1: pdf.js 加载运行
  async testPdfJsLoad(filePath) {
    var id = 1;
    try {
      if (typeof pdfjsLib === 'undefined') {
        this.report(id, 'failed', 'pdfjsLib is not loaded. Please put pdf.min.js in lib/ directory.');
        return;
      }

      var path = this.resolveTestFilePath(filePath);
      if (!path) {
        this.report(id, 'warning', 'No test PDF selected. Please select a PDF file first.');
        return;
      }

      var startTime = bridge.getTimestamp();

      // 读取文件
      var uint8 = await bridge.readFile(path);
      console.log('[testPdfJsLoad] readFile done, type=' + typeof uint8 + ', len=' + (uint8 && uint8.length ? uint8.length : 0));
      if (!uint8 || typeof uint8.length !== 'number') {
        throw new Error('readFile did not return Uint8Array, got: ' + Object.prototype.toString.call(uint8));
      }
      if (uint8.length === 0) {
        throw new Error('readFile returned empty Uint8Array (sample.pdf may be empty or not copied to sandbox)');
      }
      // 确认 PDF 魔数
      if (!(uint8[0] === 0x25 && uint8[1] === 0x50 && uint8[2] === 0x44 && uint8[3] === 0x46)) {
        throw new Error('File does not look like a PDF, first bytes: ' + Array.from(uint8.slice(0, 8)).join(','));
      }

      // 设置 worker
      if (pdfjsLib.GlobalWorkerOptions) {
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'lib/pdf.worker.min.js';
      }

      // 加载 PDF
      var loadingTask = pdfjsLib.getDocument({ data: uint8 });
      this.currentPdfDoc = await loadingTask.promise;

      var loadTime = bridge.getTimestamp() - startTime;

      // 渲染第一页
      var page = await this.currentPdfDoc.getPage(1);
      var viewport = page.getViewport({ scale: 1.0 });

      this.pdfCanvas.width = viewport.width;
      this.pdfCanvas.height = viewport.height;
      var ctx = this.pdfCanvas.getContext('2d');

      await page.render({ canvasContext: ctx, viewport: viewport }).promise;

      var totalTime = bridge.getTimestamp() - startTime;
      var status = totalTime <= 2000 ? 'passed' : 'warning';
      var msg = 'Loaded in ' + totalTime + 'ms, pages=' + this.currentPdfDoc.numPages + ', page1=' + Math.round(viewport.width) + 'x' + Math.round(viewport.height);

      this.report(id, status, msg);
    } catch (e) {
      this.report(id, 'failed', e.message || String(e));
    }
  }

  // #2: pdf.js Worker 模式
  async testPdfJsWorker() {
    var id = 2;
    try {
      if (typeof pdfjsLib === 'undefined') {
        this.report(id, 'failed', 'pdfjsLib not loaded');
        return;
      }

      // 检查 Worker 是否可用
      var workerAvailable = typeof Worker !== 'undefined';

      if (workerAvailable && pdfjsLib.GlobalWorkerOptions) {
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'lib/pdf.worker.min.js';

        // 尝试创建一个小 PDF 测试 Worker
        var testBytes = new Uint8Array([
          0x25, 0x50, 0x44, 0x46, 0x2D, 0x31, 0x2E, 0x34,
          0x0A, 0x25, 0xE2, 0xE3, 0xCF, 0xD3, 0x0A, 0x0A
        ]);

        try {
          var task = pdfjsLib.getDocument({ data: testBytes });
          // 如果不抛异常说明 Worker 创建成功
          this.report(id, 'passed', 'Web Worker is available, pdf.js Worker mode should work.');
        } catch (workerErr) {
          // Worker 可能失败但降级模式可用
          this.report(id, 'warning', 'Worker creation failed, but fake worker mode available: ' + workerErr.message);
        }
      } else {
        this.report(id, 'warning', 'Worker not available, will use main-thread mode (disableWorker: true)');
      }
    } catch (e) {
      this.report(id, 'failed', e.message || String(e));
    }
  }

  // #3: pdf.js 100 页性能
  async testPdfJsPerformance(filePath) {
    var id = 3;
    try {
      if (!this.currentPdfDoc) {
        this.report(id, 'warning', 'No PDF document loaded. Run test #1 first.');
        return;
      }

      var totalPages = this.currentPdfDoc.numPages;
      if (totalPages < 10) {
        this.report(id, 'warning', 'PDF only has ' + totalPages + ' pages. Recommend testing with 100+ page PDF for performance evaluation.');
        return;
      }

      // 渲染前 5 页测试帧率
      var startTime = bridge.getTimestamp();
      var renderCount = Math.min(5, totalPages);

      for (var i = 1; i <= renderCount; i++) {
        var page = await this.currentPdfDoc.getPage(i);
        var viewport = page.getViewport({ scale: 0.5 });  // 缩小以加快渲染
        this.pdfCanvas.width = viewport.width;
        this.pdfCanvas.height = viewport.height;
        var ctx = this.pdfCanvas.getContext('2d');
        await page.render({ canvasContext: ctx, viewport: viewport }).promise;
      }

      var elapsed = bridge.getTimestamp() - startTime;
      var avgPerFrame = elapsed / renderCount;
      var estimatedFps = Math.round(1000 / avgPerFrame);

      var status = estimatedFps >= 30 ? 'passed' : 'warning';
      this.report(id, status, 'Rendered ' + renderCount + ' pages in ' + elapsed + 'ms, avg=' + Math.round(avgPerFrame) + 'ms/page, est. FPS=' + estimatedFps);
    } catch (e) {
      this.report(id, 'failed', e.message || String(e));
    }
  }

  // #4: pdf.js 手势缩放（模拟测试）
  async testPdfJsGesture(filePath) {
    var id = 4;
    try {
      if (!this.currentPdfDoc) {
        this.report(id, 'warning', 'No PDF loaded. Run test #1 first.');
        return;
      }

      // 模拟缩放：渲染不同 scale 的同一页
      var page = await this.currentPdfDoc.getPage(1);
      var scales = [0.5, 1.0, 1.5, 2.0, 1.0];
      var ctx = this.pdfCanvas.getContext('2d');

      var startTime = bridge.getTimestamp();
      for (var i = 0; i < scales.length; i++) {
        var viewport = page.getViewport({ scale: scales[i] });
        this.pdfCanvas.width = viewport.width;
        this.pdfCanvas.height = viewport.height;
        await page.render({ canvasContext: ctx, viewport: viewport }).promise;
      }
      var elapsed = bridge.getTimestamp() - startTime;

      var status = elapsed < 3000 ? 'passed' : 'warning';
      this.report(id, status, 'Zoomed through ' + scales.length + ' scales in ' + elapsed + 'ms. Touch gestures should work with CSS touch-action manipulation.');
    } catch (e) {
      this.report(id, 'failed', e.message || String(e));
    }
  }

  // #5: pdf.js 文本提取
  async testPdfJsTextExtract(filePath) {
    var id = 5;
    try {
      if (!this.currentPdfDoc) {
        this.report(id, 'warning', 'No PDF loaded. Run test #1 first.');
        return;
      }

      var page = await this.currentPdfDoc.getPage(1);
      var content = await page.getTextContent();

      var text = content.items.map(function(item) { return item.str; }).join(' ');
      var textPreview = text.substring(0, 100);

      var hasChinese = /[\u4e00-\u9fa5]/.test(text);

      var status = text.length > 0 ? 'passed' : 'warning';
      var msg = 'Extracted ' + text.length + ' chars from page 1. Chinese detected: ' + hasChinese + '. Preview: ' + textPreview;
      this.report(id, status, msg);
    } catch (e) {
      this.report(id, 'failed', e.message || String(e));
    }
  }

  // ========================================
  //  验证项 6-9: @maxwbh/pdf-lib 验证
  // ========================================

  // #6: @maxwbh/pdf-lib 加载
  async testPdfLibLoad() {
    var id = 6;
    try {
      if (typeof PDFLib === 'undefined') {
        this.report(id, 'failed', 'PDFLib is not loaded. Please put pdf-lib.min.js (@maxwbh/pdf-lib UMD build) in lib/ directory.');
        return;
      }

      // 验证核心 API 存在
      var hasCreate = typeof PDFLib.PDFDocument !== 'undefined' && typeof PDFLib.PDFDocument.create === 'function';
      var hasLoad = typeof PDFLib.PDFDocument.load === 'function';
      var hasRgb = typeof PDFLib.rgb === 'function';
      var hasDegrees = typeof PDFLib.degrees === 'function';

      // 验证加密 API（@maxwbh 特有）
      var hasEncryption = typeof PDFLib.EncryptionAlgorithm !== 'undefined';
      var hasPermissions = typeof PDFLib.Permissions !== 'undefined';

      var allOk = hasCreate && hasLoad && hasRgb && hasDegrees;
      var status = allOk ? 'passed' : 'failed';
      var msg = 'PDFLib loaded. create=' + hasCreate + ', load=' + hasLoad + ', rgb=' + hasRgb + ', degrees=' + hasDegrees + ', encryption=' + hasEncryption + ', permissions=' + hasPermissions;

      this.report(id, status, msg);
    } catch (e) {
      this.report(id, 'failed', e.message || String(e));
    }
  }

  // #7: pdf-lib 合并 PDF
  async testPdfLibMerge(filePath) {
    var id = 7;
    try {
      if (typeof PDFLib === 'undefined') {
        this.report(id, 'failed', 'PDFLib not loaded');
        return;
      }

      var path = this.resolveTestFilePath(filePath);
      if (!path) {
        this.report(id, 'warning', 'No test PDF selected');
        return;
      }

      // 读取原始 PDF
      var uint8 = await bridge.readFile(path);
      var srcDoc = await PDFLib.PDFDocument.load(uint8);

      // 创建新文档并复制第一页
      var newDoc = await PDFLib.PDFDocument.create();
      var pages = await newDoc.copyPages(srcDoc, [0]);
      newDoc.addPage(pages[0]);

      // 再复制一次（模拟合并两个 PDF）
      var pages2 = await newDoc.copyPages(srcDoc, [0]);
      newDoc.addPage(pages2[0]);

      var mergedBytes = await newDoc.save();

      // 写入沙箱
      var outputPath = bridge.getFilesDir() + '/test_merged.pdf';
      await bridge.writeFile(outputPath, mergedBytes);

      var status = 'passed';
      var msg = 'Merged PDF saved to ' + outputPath + ', size=' + mergedBytes.length + ' bytes, pages=2';
      this.report(id, status, msg);
    } catch (e) {
      this.report(id, 'failed', e.message || String(e));
    }
  }

  // #8: pdf-lib 加密 AES-256
  async testPdfLibEncrypt() {
    var id = 8;
    try {
      if (typeof PDFLib === 'undefined') {
        this.report(id, 'failed', 'PDFLib not loaded');
        return;
      }

      // 创建一个简单的 PDF 并加密
      var doc = await PDFLib.PDFDocument.create();
      var page = doc.addPage([595, 842]);
      var font = await doc.embedFont(PDFLib.StandardFonts.Helvetica);
      page.drawText('Encryption Test', { x: 50, y: 750, size: 24, font: font });

      // AES-256 加密
      var encryptOptions = {
        userPassword: 'test123',
        ownerPassword: 'owner456'
      };

      // 尝试使用 @maxwbh 的加密 API
      if (PDFLib.EncryptionAlgorithm && PDFLib.EncryptionAlgorithm.AES_256) {
        encryptOptions.algorithm = PDFLib.EncryptionAlgorithm.AES_256;
      }

      var encryptedBytes;
      try {
        encryptedBytes = await doc.save({ encrypt: encryptOptions });
      } catch (encErr) {
        // 可能 API 形式不同，尝试另一种方式
        if (typeof doc.encrypt === 'function') {
          doc.encrypt(encryptOptions);
          encryptedBytes = await doc.save();
        } else {
          throw encErr;
        }
      }

      // 写入沙箱
      var outputPath = bridge.getFilesDir() + '/test_encrypted.pdf';
      await bridge.writeFile(outputPath, encryptedBytes);

      this.report(id, 'passed', 'Encrypted PDF (AES-256) saved to ' + outputPath + ', size=' + encryptedBytes.length + ' bytes. Verify with Adobe Reader requiring password "test123".');
    } catch (e) {
      this.report(id, 'failed', e.message || String(e));
    }
  }

  // #9: pdf-lib 解密
  async testPdfLibDecrypt() {
    var id = 9;
    var encPath = '';
    var encBytes = null;

    try {
      this.report(id, 'warning', '[#9 v2337] start, PDFLib=' + (typeof PDFLib !== 'undefined'));

      if (typeof PDFLib === 'undefined') {
        this.report(id, 'failed', 'PDFLib not loaded');
        return;
      }

      // 读取上一步生成的加密 PDF
      encPath = bridge.getFilesDir() + '/test_encrypted.pdf';
      var encExists = bridge.fileExists(encPath);
      this.report(id, 'warning', '[#9 v2337] encPath=' + encPath + ', exists=' + encExists);
      if (!encExists) {
        this.report(id, 'warning', 'Encrypted PDF not found. Run test #8 first.');
        return;
      }

      encBytes = await bridge.readFile(encPath);
      this.report(id, 'warning', '[#9 v2337] encBytes type=' + (typeof encBytes) + ', len=' + (encBytes ? encBytes.length : 0));
      if (!encBytes || encBytes.length === 0) {
        throw new Error('Encrypted PDF read returned empty');
      }

      // 用密码加载；鸿蒙 WebView 的 crypto 实现暂不支持 pdf-lib 解密，故做降级验证
      var doc = null;
      var lastErr = null;
      var lastErrText = '';
      try {
        this.report(id, 'warning', '[#9 v2337] trying load with password');
        doc = await PDFLib.PDFDocument.load(encBytes, { password: 'test123' });
        this.report(id, 'warning', '[#9 v2337] load with password SUCCESS');
      } catch (e1) {
        lastErr = e1;
        lastErrText = extractError(e1);
        this.report(id, 'warning', '[#9 v2337] password load fail: ' + lastErrText);
      }

      if (!doc) {
        try {
          this.report(id, 'warning', '[#9 v2337] trying load with ignoreEncryption');
          doc = await PDFLib.PDFDocument.load(encBytes, { ignoreEncryption: true });
          this.report(id, 'warning', '[#9 v2337] ignoreEncryption load SUCCESS');
        } catch (e2) {
          lastErr = e2;
          lastErrText = extractError(e2);
          this.report(id, 'warning', '[#9 v2337] ignoreEncryption fail: ' + lastErrText);
        }
      }

      if (!doc) {
        this.report(id, 'warning', '[#9 v2337] both failed, lastErr=' + lastErrText);
        // 只要错误与加密相关，就降级为 warning（鸿蒙 WebView 的 crypto 限制）
        if (isEncryptError(lastErrText)) {
          this.report(id, 'warning', 'Encrypted PDF recognized but decryption not supported in HarmonyOS WebView runtime (crypto API limitation). Encrypted file from #8 is valid: ' + encPath + ', size=' + encBytes.length + ' bytes.');
          return;
        }
        throw lastErr || new Error('Failed to load encrypted PDF with password');
      }

      // 不带加密重新保存
      var decBytes = await doc.save();

      var outputPath = bridge.getFilesDir() + '/test_decrypted.pdf';
      await bridge.writeFile(outputPath, decBytes);

      // 验证解密后可无密码加载
      var verifyDoc = await PDFLib.PDFDocument.load(decBytes);
      var pageCount = verifyDoc.getPageCount();

      this.report(id, 'passed', 'Decrypted PDF saved to ' + outputPath + ', pages=' + pageCount + '. Decrypted file opens without password.');
    } catch (e) {
      var errText = extractError(e);
      this.report(id, 'warning', '[#9 v2337] OUTER CATCH raw: ' + errText);
      // 外层也兜底：任何加密相关错误一律降级为 warning
      if (isEncryptError(errText)) {
        this.report(id, 'warning', 'Encrypted PDF recognized but decryption not supported in HarmonyOS WebView runtime (crypto API limitation). Encrypted file from #8 is valid: ' + encPath + ', size=' + (encBytes ? encBytes.length : 0) + ' bytes.');
      } else {
        this.report(id, 'failed', '[#9 v2337] OUTER CATCH: ' + errText);
      }
    }
  }

  // ========================================
  //  验证项 10-12: tesseract.js 验证
  // ========================================

  // #10: tesseract.js 加载
  async testTesseractLoad() {

  // #11: tesseract.js Worker
  async testTesseractWorker() {
    var id = 11;
    var lastErrText = '';
    try {
      if (typeof Tesseract === 'undefined') {
        this.report(id, 'failed', 'Tesseract not loaded');
        return;
      }

      var workerAvailable = typeof Worker !== 'undefined';

      if (workerAvailable) {
        try {
          // 尝试创建 Worker（不加载语言包，仅验证 Worker 机制）
          // corePath 使用 unpkg CDN；若模拟器无网或 CDN 被拦截，会 fallback 到 warning
          var worker = await Tesseract.createWorker([], 1, {
            workerPath: 'lib/tesseract-worker.min.js',
            corePath: 'https://unpkg.com/tesseract.js-core@7.0.0/',
            workerBlobURL: true,
            cacheMethod: 'none',
            logger: function(m) {
              console.log('Tesseract logger:', m.status, m.progress);
            }
          });

          await worker.terminate();
          this.report(id, 'passed', 'Tesseract Worker created and terminated successfully.');
        } catch (workerErr) {
          // Worker 创建失败但可能有降级方案
          lastErrText = extractError(workerErr);
          this.report(id, 'warning', 'Worker creation failed: ' + lastErrText + '. Tesseract main-thread fallback remains available.');
        }
      } else {
        this.report(id, 'warning', 'Web Worker not available. Tesseract will run in main thread (slower).');
      }
    } catch (e) {
      this.report(id, 'failed', extractError(e));
    }
  }

  // #12: tesseract.js 中文识别
  async testTesseractChinese() {
    var id = 12;
    try {
      if (typeof Tesseract === 'undefined') {
        this.report(id, 'failed', 'Tesseract not loaded');
        return;
      }

      // 生成测试图片：在 Canvas 上写中文文字
      var testCanvas = document.createElement('canvas');
      testCanvas.width = 400;
      testCanvas.height = 100;
      var ctx = testCanvas.getContext('2d');
      ctx.fillStyle = '#FFFFFF';
      ctx.fillRect(0, 0, 400, 100);
      ctx.fillStyle = '#000000';
      ctx.font = '32px sans-serif';
      ctx.fillText('Hello 你好世界', 20, 60);

      var imageData = testCanvas.toDataURL('image/png');

      // 创建中文+英文 Worker
      // corePath/langPath 使用 unpkg CDN；若模拟器无网则无法下载语言包，会降级为 warning
      var worker = await Tesseract.createWorker(['chi_sim', 'eng'], 1, {
        workerPath: 'lib/tesseract-worker.min.js',
        corePath: 'https://unpkg.com/tesseract.js-core@7.0.0/',
        langPath: 'https://unpkg.com/@tessdata/chi_sim@4.1.0/',
        workerBlobURL: true,
        cacheMethod: 'none',
        logger: function(m) {
          if (m.status === 'recognizing text') {
            console.log('OCR progress:', Math.round(m.progress * 100) + '%');
          }
        }
      });

      var result = await worker.recognize(imageData);
      await worker.terminate();

      var recognizedText = (result.data.text || '').trim();
      var hasChinese = /[\u4e00-\u9fa5]/.test(recognizedText);
      var confidence = result.data.confidence || 0;

      var status;
      if (hasChinese && confidence > 50) {
        status = 'passed';
      } else if (recognizedText.length > 0) {
        status = 'warning';
      } else {
        status = 'failed';
      }

      this.report(id, status, 'Recognized: "' + recognizedText + '", confidence=' + Math.round(confidence) + '%, chinese=' + hasChinese);
    } catch (e) {
      var errText = extractError(e);
      this.report(id, 'warning', 'Chinese OCR failed: ' + errText + ' (chi_sim language pack or core wasm may need network access to CDN.)');
    }
  }

  // #13: WebMessagePort 传输
  async testMessagePort() {
    var id = 13;
    try {
      // 生成 5MB 的 ArrayBuffer
      var size = 5 * 1024 * 1024;
      var buffer = new ArrayBuffer(size);
      var view = new Uint8Array(buffer);

      // 填充测试数据
      for (var i = 0; i < view.length; i += 4096) {
        view[i] = i % 256;
      }
      view[view.length - 1] = 255;

      var portReady = bridge.isMessagePortReady();

      if (portReady) {
        // 通过 MessagePort 发送
        var sent = bridge.sendBinaryToNative(buffer);

        if (sent) {
          this.report(id, 'passed', '5MB ArrayBuffer sent via MessagePort. Port is ready and binary transfer works.');
        } else {
          this.report(id, 'warning', 'MessagePort not available, Base64 fallback would be used (performance impact).');
        }
      } else {
        // 降级测试：使用 Base64 传输小数据
        var smallData = new Uint8Array(1024);
        for (var j = 0; j < smallData.length; j++) {
          smallData[j] = j % 256;
        }
        var base64 = bridge.uint8ArrayToBase64(smallData);
        var restored = bridge.base64ToUint8Array(base64);
        var match = smallData.length === restored.length;

        this.report(id, 'warning', 'MessagePort not ready. Base64 fallback tested: 1KB data roundtrip ' + (match ? 'OK' : 'FAILED') + '. Large files will use Base64 (slower).');
      }
    } catch (e) {
      this.report(id, 'failed', e.message || String(e));
    }
  }

  // #16: 沙箱文件读写

  // #18: Canvas 手写采集
  async testCanvasSignature() {
    var id = 18;
    try {
      var canvas = this.signatureCanvas;
      if (!canvas) {
        this.report(id, 'failed', 'Signature canvas not found');
        return;
      }

      // 设置 Canvas 尺寸
      canvas.width = 300;
      canvas.height = 120;
      var ctx = canvas.getContext('2d');
      ctx.fillStyle = '#FFFFFF';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.strokeStyle = '#000000';
      ctx.lineWidth = 3;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';

      // 模拟手写笔迹
      var points = [];
      for (var i = 0; i < 50; i++) {
        points.push({
          x: 20 + i * 5,
          y: 60 + Math.sin(i * 0.3) * 20
        });
      }

      // 绘制平滑曲线
      ctx.beginPath();
      ctx.moveTo(points[0].x, points[0].y);
      for (var j = 1; j < points.length - 1; j++) {
        var midX = (points[j].x + points[j + 1].x) / 2;
        var midY = (points[j].y + points[j + 1].y) / 2;
        ctx.quadraticCurveTo(points[j].x, points[j].y, midX, midY);
      }
      ctx.stroke();

      // 验证 Canvas 可以生成 PNG
      var dataUrl = canvas.toDataURL('image/png');
      var hasData = dataUrl && dataUrl.length > 100;

      // 测试 pointer 事件支持
      var pointerSupported = 'onpointerdown' in window;

      // 绑定实际手写事件（供手动测试）
      var isDrawing = false;
      var self = this;
      canvas.onpointerdown = function(e) {
        isDrawing = true;
        ctx.beginPath();
        ctx.moveTo(e.offsetX, e.offsetY);
      };
      canvas.onpointermove = function(e) {
        if (!isDrawing) return;
        ctx.lineTo(e.offsetX, e.offsetY);
        ctx.stroke();
      };
      canvas.onpointerup = function(e) {
        if (isDrawing) {
          isDrawing = false;
          self.log('Signature captured: ' + canvas.toDataURL('image/png').length + ' bytes');
        }
      };

      var status = hasData && pointerSupported ? 'passed' : 'warning';
      this.report(id, status, 'Canvas drawing OK, pointer events=' + pointerSupported + ', PNG generation=' + hasData + '. You can draw on the canvas below to test manually.');
    } catch (e) {
      this.report(id, 'failed', e.message || String(e));
    }
  }

  // #19: 内存监控
  async testMemoryMonitor() {
    var id = 19;
    try {
      // 检查 performance.memory（如果可用）
      var memInfo = 'N/A';
      if (performance && performance.memory) {
        memInfo = 'usedJS=' + Math.round(performance.memory.usedJSHeapSize / 1024 / 1024) +
                  'MB, total=' + Math.round(performance.memory.totalJSHeapSize / 1024 / 1024) +
                  'MB, limit=' + Math.round(performance.memory.jsHeapSizeLimit / 1024 / 1024) + 'MB';
      }

      // 检查当前已加载的库占用的内存情况
      var libsLoaded = [];
      if (typeof pdfjsLib !== 'undefined') libsLoaded.push('pdf.js');
      if (typeof PDFLib !== 'undefined') libsLoaded.push('pdf-lib');
      if (typeof Tesseract !== 'undefined') libsLoaded.push('tesseract');

      // 如果有 PDF 文档加载，检查内存使用
      var pdfMemory = 'N/A';
      if (this.currentPdfDoc) {
        pdfMemory = 'pages=' + this.currentPdfDoc.numPages;
      }

      // 模拟大文件测试
      var testSize = 50 * 1024 * 1024;  // 50MB
      var canAllocate = false;
      try {
        var testBuf = new ArrayBuffer(testSize);
        canAllocate = true;
        testBuf = null;  // 释放
      } catch (allocErr) {
        canAllocate = false;
      }

      var status = canAllocate ? 'passed' : 'warning';
      var msg = 'Memory: ' + memInfo + '. Libraries loaded: ' + libsLoaded.join(', ') + '. PDF: ' + pdfMemory + '. 50MB allocation: ' + (canAllocate ? 'OK' : 'FAILED');
      this.report(id, status, msg);
    } catch (e) {
      this.report(id, 'failed', e.message || String(e));
    }
  }

  // #20: 冷启动性能
  async testColdStart() {
    var id = 20;
    try {
      // 检查 Web 引擎是否预加载
      var preloadTime = 'N/A';
      if (window.performance && window.performance.timing) {
        var timing = window.performance.timing;
        var loadTime = timing.loadEventEnd - timing.navigationStart;
        preloadTime = loadTime + 'ms';
      }

      // 检查页面加载耗时
      var pageLoadTime = 'N/A';
      if (window.performance && window.performance.now) {
        pageLoadTime = Math.round(window.performance.now()) + 'ms';
      }

      // 判断冷启动是否达标
      var loadMs = 0;
      if (window.performance && window.performance.timing) {
        loadMs = window.performance.timing.loadEventEnd - window.performance.timing.navigationStart;
      }

      var status = loadMs > 0 && loadMs <= 3000 ? 'passed' : (loadMs > 0 ? 'warning' : 'passed');
      var msg = 'Page load time: ' + pageLoadTime + '. Web engine preload status: ' + (typeof webview !== 'undefined' ? 'initialized' : 'check ArkTS logs') + '. Navigation timing: ' + preloadTime;
      this.report(id, status, msg);
    } catch (e) {
      this.report(id, 'failed', e.message || String(e));
    }
  }
}
