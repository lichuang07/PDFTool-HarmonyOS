<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>PDF 编辑器</title>
  <link rel="stylesheet" href="../css/viewer.css" />
  <style>
    /* 编辑页（V1.1 开发中补全，详见技术方案 4.2.2）
     * 工具选择已前置到「阅读器编辑模态框 / 首页 PDF工具 Tab」，此处不再堆叠按钮。 */
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #525659; font-family: -apple-system, "HarmonyOS Sans", sans-serif; }
    #editor-app { display: flex; flex-direction: column; width: 100%; height: 100%; }
    /* 轻量顶栏：展示当前激活工具（由 ArkTS 经 window.__PDF_TOOL__ 注入） */
    #editor-header { padding: 10px 14px; background: rgba(38,38,40,0.92); flex-shrink: 0; color: #f2f2f2; font-size: 14px; }
    #editor-header .e-tool { color: #5aa9ff; font-weight: 600; }
    #editor-body { flex: 1; position: relative; overflow: hidden; }
    #editor-output { position: absolute; left: 12px; right: 12px; bottom: 12px; color: #eee; font-size: 13px; background: rgba(0,0,0,0.45); padding: 8px 12px; border-radius: 10px; line-height: 1.5; }
  </style>
</head>
<body>
  <div id="editor-app">
    <div id="editor-header">当前工具：<span class="e-tool" id="e-tool-name">未指定</span></div>
    <div id="editor-body">
      <div id="editor-output">编辑工具（V1.1 开发中）——页面选择 / 参数面板 / 进度展示将在此区域补全</div>
    </div>
  </div>

  <!-- 第三方库 -->
  <script src="../lib/pdf.min.js"></script>
  <!-- pdf-lib 同步加载以便骨架立即可用；正式实现可改为 moduleLoader.loadPdfEditor() 按需注入（见 module-loader.js / 技术方案 4.2.3） -->
  <script src="../lib/pdf-lib.min.js"></script>
  <!-- ArkWeb 等受限环境的 JS 全局对象 polyfill：fontkit UMD 依赖 self/globalThis，
       某些 WebView 内核里这些全局别名不存在，会导致 fontkit 初始化失败，进而中文 embed 不可用。 -->
  <script>
    (function () {
      try {
        if (typeof window === 'undefined') { return; }
        if (typeof self === 'undefined') { window.self = window; }
        if (typeof globalThis === 'undefined') { window.globalThis = window; }
        if (typeof global === 'undefined') { window.global = window; }
      } catch (e) {}
    })();
  </script>
  <!-- fontkit：pdf-lib 嵌入自定义字体（含中文 OTF）所必需，须在使用 embedFont 前加载并注册。
       注意：本构建的 registerFontkit 是 PDFDocument 实例方法（doc.registerFontkit），非静态方法。 -->
  <script src="../lib/fontkit.umd.js"></script>

  <!-- 桥接层 + 编辑封装 + 工具交互层 -->
  <script src="../js/bridge.js"></script>
  <script src="../js/module-loader.js"></script>
  <script src="../js/ocr.js"></script>
  <script src="../js/editor.js"></script>
  <script src="../js/editor-ui.js"></script>

</body>
</html>
