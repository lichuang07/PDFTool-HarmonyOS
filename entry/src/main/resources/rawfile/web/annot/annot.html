<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>PDF 标注</title>
  <style>
    /* V1.3 交互式标注页（故事 #048 手写签名 / #049 高亮标注）
     * 结构：顶栏（工具名 + 页码） / 中央画布（pdf.js 渲染页 + 透明叠加画布） / 底部工具条
     * 标注数据统一以「PDF 用户空间坐标」（原点左下、y 向上）保存，
     * 由 pdf.js viewport.convertToPdfPoint 换算，缩放/重排后依然准确。 */
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #f2f3f5;
      font-family: -apple-system, "HarmonyOS Sans", sans-serif; }
    #annot-app { display: flex; flex-direction: column; width: 100%; height: 100%; }

    #annot-header { display: flex; align-items: center; padding: 10px 14px;
      background: #ffffff; border-bottom: 1px solid #ececec; flex-shrink: 0; }
    #a-tool-name { font-size: 15px; font-weight: 600; color: #1a1a1a; }
    #a-page-info { margin-left: auto; font-size: 13px; color: #666; }

    #annot-stage { flex: 1; position: relative; overflow: auto; -webkit-overflow-scrolling: touch;
      background: #dfe1e5; }
    #annot-pages { position: relative; margin: 12px auto; width: max-content; height: max-content;
      box-shadow: 0 2px 12px rgba(0,0,0,0.18); background: #fff; }
    #page-canvas { display: block; }
    /* 叠加画布：承载笔迹 / 高亮预览，透明；touch-action:none 保证 pointer 事件不被滚动吞掉 */
    #overlay-canvas { position: absolute; left: 0; top: 0; touch-action: none; }

    #annot-bar { flex-shrink: 0; background: #ffffff; border-top: 1px solid #ececec;
      padding: 10px 12px 14px; }
    .bar-row { display: flex; align-items: center; gap: 10px; }
    .bar-row + .bar-row { margin-top: 10px; }
    .bar-label { font-size: 12px; color: #888; min-width: 34px; }
    .bar-btn { flex: 1; height: 40px; border: none; border-radius: 10px; background: #f1f2f4;
      color: #333; font-size: 14px; font-weight: 500; cursor: pointer; }
    .bar-btn:disabled { opacity: 0.45; }
    .bar-btn.primary { background: #2f6bff; color: #fff; font-weight: 600; }
    #color-input { width: 40px; height: 34px; border: 1px solid #dcdcdc; border-radius: 8px;
      background: #fff; padding: 2px; cursor: pointer; }
    #width-range, #opacity-range { flex: 1; accent-color: #2f6bff; }
    .swatches { display: flex; gap: 8px; flex: 1; }
    .swatch { width: 30px; height: 30px; border-radius: 50%; border: 2px solid transparent;
      cursor: pointer; }
    .swatch.active { border-color: #2f6bff; }

    #annot-output { position: absolute; left: 12px; right: 12px; bottom: 96px; color: #eee;
      font-size: 13px; background: rgba(0,0,0,0.62); padding: 10px 12px; border-radius: 10px;
      line-height: 1.5; }
    .result-card { position: absolute; left: 12px; right: 12px; bottom: 96px;
      background: rgba(38,44,52,0.97); border-radius: 14px; padding: 14px; box-sizing: border-box;
      box-shadow: 0 6px 20px rgba(0,0,0,0.35); }
    .result-close { position: absolute; top: 8px; right: 8px; width: 24px; height: 24px;
      border-radius: 50%; background: rgba(255,255,255,0.08); color: #c8c8c8; font-size: 18px;
      line-height: 22px; text-align: center; cursor: pointer; }
    .result-btn { flex: 1; height: 40px; border: none; border-radius: 8px; color: #fff;
      font-size: 14px; font-weight: 600; cursor: pointer; box-sizing: border-box; }
  </style>
</head>
<body>
  <div id="annot-app">
    <div id="annot-header">
      <span id="a-tool-name">标注</span>
      <span id="a-page-info">-/-</span>
    </div>

    <div id="annot-stage">
      <div id="annot-pages">
        <canvas id="page-canvas"></canvas>
        <canvas id="overlay-canvas"></canvas>
      </div>
    </div>

    <div id="annot-bar">
      <div class="bar-row">
        <span class="bar-label">颜色</span>
        <input type="color" id="color-input" value="#1f4fd8" />
        <input type="range" id="width-range" min="1" max="12" step="1" value="3" />
        <input type="range" id="opacity-range" min="10" max="80" step="5" value="40" />
      </div>
      <div class="bar-row">
        <button class="bar-btn" id="btn-undo">撤销</button>
        <button class="bar-btn" id="btn-clear">清除本页</button>
        <button class="bar-btn" id="btn-prev">‹ 上一页</button>
        <button class="bar-btn" id="btn-next">下一页 ›</button>
      </div>
      <div class="bar-row">
        <button class="bar-btn" id="btn-zoom-out">缩小</button>
        <button class="bar-btn" id="btn-zoom-in">放大</button>
        <button class="bar-btn primary" id="btn-save">保存标注</button>
      </div>
    </div>

    <div id="annot-output">正在加载…</div>
  </div>

  <!-- 第三方库：pdf.js 用于渲染页面，pdf-lib 用于落盘（经 editor.js 的 PdfEditor） -->
  <script src="../lib/pdf.min.js"></script>
  <script src="../lib/pdf-lib.min.js"></script>
  <script>
    // ArkWeb 等受限环境的全局对象 polyfill（fontkit UMD 依赖 self/globalThis/global）
    (function () {
      try {
        if (typeof window === 'undefined') { return; }
        if (typeof self === 'undefined') { window.self = window; }
        if (typeof globalThis === 'undefined') { window.globalThis = window; }
        if (typeof global === 'undefined') { window.global = window; }
      } catch (e) {}
    })();
  </script>
  <script src="../lib/fontkit.umd.js"></script>

  <!-- 桥接层 + 编辑封装 + 标注交互层 -->
  <script src="../js/bridge.js"></script>
  <script src="../js/module-loader.js"></script>
  <script src="../js/ocr.js"></script>
  <script src="../js/editor.js"></script>
  <script src="../js/annot.js"></script>
</body>
</html>
